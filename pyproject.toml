[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ts_dynalenegui"
description = "Graphical user interface of the Dynalene system."
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
dynamic = [ "version" ]
dependencies = ["pyside6", "pyyaml", "qasync", "ts_guitool"]

[tool.setuptools.packages.find]
where = [ "python" ]

[project.scripts]
run_dynalenegui = "lsst.ts.dynalenegui:run_dynalenegui"

[tool.setuptools_scm]
write_to = "python/lsst/ts/dynalenegui/version.py"
write_to_template = """
# Generated by setuptools_scm
__all__ = ["__version__"]
__version__ = "{version}"
"""
